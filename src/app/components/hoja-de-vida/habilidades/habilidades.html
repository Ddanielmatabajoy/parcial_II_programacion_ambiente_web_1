<section class="card shadow-sm mb-4">
  <div class="card-header fw-bold">Conocimientos y habilidades</div>
  <div class="card-body">
    @for (h of habilidades; track h.nombre) {
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <span>{{ h.nombre }} <span class="badge bg-secondary">{{ h.categoria }}</span></span>
          <small>{{ h.nivel }}%</small>
        </div>
        <div class="progress" style="height: 8px">
          <div class="progress-bar" [style.width.%]="h.nivel"></div>
        </div>
      </div>
    }
  </div>
</section>
