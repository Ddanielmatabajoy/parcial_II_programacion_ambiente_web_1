<h1 class="h2 mb-4">Aprendizaje del curso</h1>

<h2 class="h4 mb-3">Temas estudiados</h2>
<div class="row g-3 mb-5">
  @for (tema of temas; track tema.id) {
    <div class="col-md-6 col-lg-4">
      <app-tema-card [tema]="tema" />
    </div>
  } @empty {
    <p class="text-muted">No hay temas registrados.</p>
  }
</div>

<h2 class="h4 mb-3">Proyectos y actividades</h2>
<app-proyectos-tabla [proyectos]="proyectos" />
